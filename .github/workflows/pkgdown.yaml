# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::ggplot2, any::scales, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Strip internal pages from built site
        run: |
          rm -f docs/CLAUDE.html docs/ARCHITECTURE_PLAN.html
          # Remove them from the search index if present
          if [ -f docs/search.json ]; then
            python3 -c "
          import json, pathlib
          p = pathlib.Path('docs/search.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          drop = ('CLAUDE.html', 'ARCHITECTURE_PLAN.html')
          keep = [d for d in data if not str(d.get('path', '')).endswith(drop)]
          p.write_text(json.dumps(keep, ensure_ascii=False), encoding='utf-8')
          "
          fi
          # Remove from sitemap if present
          if [ -f docs/sitemap.xml ]; then
            sed -i '/CLAUDE\.html/d;/ARCHITECTURE_PLAN\.html/d' docs/sitemap.xml
          fi
        shell: bash

      - name: Upload artifact for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: pkgdown
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
